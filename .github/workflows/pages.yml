# Builds the statistics portal frontend (web/) and publishes it on GitHub Pages (docs/dashboard.md).
# Repository variable PORTAL_API_URL = public HTTPS API base, e.g. https://stats.example.org/api/v1
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "server/dashboard/data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.PORTAL_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "set the repository variable PORTAL_API_URL"; exit 1; }
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
