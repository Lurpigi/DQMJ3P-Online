# Public test stack for one VPS: NEX, Postgres, SIL, SpotPass and the NAT check server, plus the
# optional statistics portal (profile "portal": dashboard + Caddy HTTPS).
# Settings come from .env (see .env.example), setup steps are in README.md.
# Memory limits keep one flooded service from taking the whole VPS (1 GB, about 100 MB in use).
x-service: &service
  restart: unless-stopped
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: dqmj3p
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dqmj3p
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dqmj3p -d dqmj3p"]
      interval: 5s
      timeout: 3s
      retries: 12

  nex:
    <<: *service
    build: ./nex
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_DQMJ3P_AUTHENTICATION_SERVER_PORT: 45000
      PN_DQMJ3P_SECURE_SERVER_HOST: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      PN_DQMJ3P_SECURE_SERVER_PORT: 45001
      PN_DQMJ3P_KERBEROS_PASSWORD: ${KERBEROS_PASSWORD:?set KERBEROS_PASSWORD in .env}
      PN_DQMJ3P_POSTGRES_URI: postgres://dqmj3p:${POSTGRES_PASSWORD}@postgres:5432/dqmj3p?sslmode=disable
      PN_DQMJ3P_DATASTORE_HTTP: 0.0.0.0:45080
      PN_DQMJ3P_DATASTORE_URL: http://${PUBLIC_IP}:45080
      PN_DQMJ3P_DATASTORE_DIR: /home/go/app/datastore
    ports:
      - "45000:45000/udp"
      - "45001:45001/udp"
      - "45080:45080/tcp"
    volumes:
      - datastore:/home/go/app/datastore

  # Loads the official communities once the NEX server has created its tables. The scripts can be
  # run again: existing rows are kept.
  seed:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      - nex
    environment:
      PGHOST: postgres
      PGUSER: dqmj3p
      PGDATABASE: dqmj3p
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./nex/sql:/sql:ro
    command:
      - sh
      - -c
      - |
        until [ -n "$$(psql -tAc "SELECT to_regclass('matchmaking.persistent_gatherings')" 2>/dev/null)" ]; do sleep 1; done
        for f in /sql/*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$$f" || exit 1; done

  sil:
    <<: *service
    image: python:3.13-alpine
    mem_limit: 128m
    user: "1000:1000"
    working_dir: /app
    command:
      - python
      - -I
      - -u
      - sil_server.py
      - --host=0.0.0.0
      - --port=8381
      - --data=/data
      - --gp-utc-offset=${GP_UTC_OFFSET:-1}
    ports:
      - "8381:8381/tcp"
    volumes:
      - ./sil:/app:ro
      - ${DATA_DIR:-./data}:/data

  spotpass:
    <<: *service
    image: python:3.13-alpine
    mem_limit: 64m
    user: "1000:1000"
    working_dir: /app
    command: ["python", "-I", "-u", "serve_spotpass.py", "/content", "8380", "0.0.0.0"]
    ports:
      - "8380:8380/tcp"
    volumes:
      - ./spotpass:/app:ro
      - ${SPOTPASS_DIR:-../re/data/spotpass_archive/canonical}:/content:ro

  # Host network: it has to bind both public addresses and reply from each of them.
  nncs:
    <<: *service
    image: python:3.13-alpine
    mem_limit: 64m
    user: "1000:1000"
    working_dir: /app
    network_mode: host
    command:
      - python
      - -I
      - -u
      - nncs_server.py
      - ${PUBLIC_IP}
      - ${PUBLIC_IP2:?set PUBLIC_IP2 in .env}
    volumes:
      - ./nncs:/app:ro

  # --- Statistics portal (docs/dashboard.md), enabled with COMPOSE_PROFILES=portal ---------------
  # One-shot: portal tables, then the two database roles (importer: portal writes + game tables it
  # imports; api: portal reads only). Waits for the tables the NEX server creates at startup.
  dashboard-migrate:
    image: server-dashboard:latest
    build: ./dashboard
    profiles: ["portal"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DASHBOARD_ADMIN_DB_URL: postgres://dqmj3p:${POSTGRES_PASSWORD}@postgres:5432/dqmj3p?sslmode=disable
      DASHBOARD_IMPORTER_PASSWORD: ${DASHBOARD_IMPORTER_PASSWORD:-}
      DASHBOARD_API_PASSWORD: ${DASHBOARD_API_PASSWORD:-}
    command: ["python", "-m", "dashboard", "migrate", "--wait",
              "ranking.scores,ranking.gcup_weeks,history.gcup_finals,matchmaking.persistent_gatherings"]

  # Importer + public read-only API, one process. It reads the SIL database read-only: stopping it
  # never affects the game, and the game never waits for it.
  dashboard:
    <<: *service
    image: server-dashboard:latest
    build: ./dashboard
    profiles: ["portal"]
    mem_limit: 192m
    user: "1000:1000"
    read_only: true
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    environment:
      DASHBOARD_DB_URL: postgres://dashboard_importer:${DASHBOARD_IMPORTER_PASSWORD:-}@postgres:5432/dqmj3p?sslmode=disable
      DASHBOARD_API_DB_URL: postgres://dashboard_api:${DASHBOARD_API_PASSWORD:-}@postgres:5432/dqmj3p?sslmode=disable
      DASHBOARD_SIL_DB: /sil-data/sil.sqlite3
      DASHBOARD_SIL_CODE: /sil/sil_server.py
      DASHBOARD_SERVER_ID: ${DASHBOARD_SERVER_ID:-production}
      DASHBOARD_ID_SALT: ${DASHBOARD_ID_SALT:-}
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-}
      DASHBOARD_TRUST_PROXY: "1"
    expose:
      - "8090"
    volumes:
      - ./sil:/sil:ro
      - ${DATA_DIR:-./data}:/sil-data:ro

  caddy:
    <<: *service
    image: caddy:2.10.2-alpine
    profiles: ["portal"]
    mem_limit: 64m
    depends_on:
      - dashboard
    environment:
      DASHBOARD_HOSTNAME: ${DASHBOARD_HOSTNAME:-localhost}
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg:
  datastore:
  caddy_data:
  caddy_config:
